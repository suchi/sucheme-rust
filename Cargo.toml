[package]
name = "sucheme-rust"
version = "0.1.0"
edition = "2021"
description = "R5RS-compliant Scheme interpreter in Rust"
license = "MIT"
repository = "https://github.com/suchi/sucheme-rust"

[[bin]]
name = "sucheme-rust"
path = "src/main.rs"

[features]
# Enable the LLVM 17 JIT back-end.
# Requires: sudo apt-get install llvm-17-dev
# Build:    cargo build --features llvm-backend
llvm-backend = ["inkwell"]

[dependencies]
actix-files = "0.6"
actix-web = "4"
anyhow = "1"
inkwell = { version = "0.4", features = ["llvm17-0"], optional = true }
rustyline = "14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# No extra test deps needed
